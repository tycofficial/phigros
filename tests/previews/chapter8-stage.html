<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DF 原 shader 实时预览</title><style>body{margin:0;background:#101521;color:#f3f7ff;font:15px system-ui}main{max-width:1050px;margin:auto;padding:18px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#222}input{width:75%}p{line-height:1.5;color:#aebbcc}button{background:#264258;color:white;padding:9px;border:1px solid #456}pre{font:12px monospace;white-space:pre-wrap}</style><main><h2>Distorted Fate 曲内 shader</h2><canvas width="1280" height="720"></canvas><p>原时间 <input type="range" min="85" max="161" step=".01" value="137"><output></output></p><button>播放 / 暂停</button><pre></pre><p>ESCColor 原公式作用整个画布；原 Grid 纹理 / 材质片元、VignettePlus 噪点 / 横线 / 暗角实时渲染。倒计时在原数据 125.2–150 秒运行（24.8 秒）。默认这些 pass 不上传主画布。Bloom、RadialBlur 和 EdgeLight 尚未还原完整管线。</p></main><script src="../../js/chapter8-stage-effects.js"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),fx=PhiChapter8StageEffects.create(canvas,{adaptive:false}),slider=document.querySelector('input');let playing=false,last=0;
function base(t){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#173d64';ctx.fillRect(0,0,1280,720);const g=ctx.createLinearGradient(0,0,1280,720);g.addColorStop(0,'#244a6d');g.addColorStop(.5,'#477080');g.addColorStop(1,'#272f59');ctx.fillStyle=g;ctx.fillRect(0,0,1280,720);for(let i=0;i<18;i++){ctx.fillStyle=['#91c9ff','#ffce80','#fff'][i%3];ctx.fillRect((i*173)%1200+25,(i*93+t*40)%650,60,10)}ctx.fillStyle='#d7f4ff';ctx.fillRect(0,570,1280,3);}
function draw(){const t=Number(slider.value);base(t);const native=PhiChapter8StageEffects.sampleNative('distorted-fate',t);if(native.showCountdown){ctx.fillStyle='#fff';ctx.fillRect(575,15,130,64);ctx.fillStyle='#000';ctx.font='30px monospace';ctx.textAlign='center';ctx.fillText(native.countDownTime.toFixed(2),640,52);ctx.font='12px sans-serif';ctx.fillText('COUNTDOWN',640,70)}const stat=fx.sample({songKey:'distorted-fate',time:t});document.querySelector('output').value=t.toFixed(2)+' s';document.querySelector('pre').textContent=JSON.stringify({...stat,exposure:native.exposure,saturation:native.saturation,contrast:native.contrast,countDownTime:native.countDownTime},null,2)}
slider.oninput=draw;document.querySelector('button').onclick=()=>playing=!playing;fx.ready.then(draw);function tick(now){if(playing){slider.value=Number(slider.value)+(now-last)/1000;draw()}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
