<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luminescence 实时粒子预览</title>
<style>html,body{margin:0;background:#11151e;color:#eef4ff;font:15px system-ui}main{max-width:1100px;margin:auto;padding:16px}canvas{display:block;width:100%;aspect-ratio:16/9;background:linear-gradient(#172532,#0a1018);pointer-events:none}label{display:block;margin:12px 0}input[type=range]{width:75%;vertical-align:middle}button,select{padding:8px;margin:6px 6px 6px 0;background:#25374d;color:inherit;border:1px solid #52647c;border-radius:5px}pre{font:12px monospace;white-space:pre-wrap}p{color:#aebed0;line-height:1.5}</style>
<main><h1>Luminescence 实时粒子</h1><canvas id="scene" width="1280" height="720" aria-label="实时 Luminescence 粒子演出"></canvas><label>音乐位置 <input id="time" type="range" min="129" max="155" step=".01" value="136.8"><output id="position"></output></label><button id="play">播放</button><button data-seek="130.9">升空前</button><button data-seek="132.4">升空</button><button data-seek="136.8">爆发</button><button data-seek="150.5">停止发射</button><select id="branch"><option value="success">成功分支</option><option value="failed">失败分支</option></select><pre id="stats"></pre><p>原粒子参数、纹理、203 顶点 mesh 与 SphereCube 双 pass shader 的浏览器重放。时间拖动、暂停和分支均直接采样，没有视频。来源为第三方修改 3.0.0.1；主相机投影及随机数与 Unity 引擎的逐像素一致性尚未验证。</p></main>
<script src="../../js/chapter8-replay-visuals.js"></script><script>
const canvas=document.querySelector('#scene'),fx=PhiChapter8ReplayVisuals.create(canvas,{clear:true,decorative:true}),time=document.querySelector('#time'),branch=document.querySelector('#branch');let playing=false,last=0;
function draw(){const f=fx.sample({time:Number(time.value),phase:'luminescence',branch:branch.value});document.querySelector('#position').value=Number(time.value).toFixed(2)+' s';document.querySelector('#stats').textContent=JSON.stringify(f,null,2);}
fx.ready.then(draw);time.oninput=draw;branch.onchange=draw;document.querySelectorAll('[data-seek]').forEach(b=>b.onclick=()=>{time.value=b.dataset.seek;draw()});document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放';last=performance.now()};function tick(now){if(playing){time.value=Number(time.value)+(now-last)/1000;if(Number(time.value)>=155)playing=false;draw()}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
