name: Engineering regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/phigros-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/phigros-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/phigros-browser/node_modules" >> "$GITHUB_ENV"
      - name: Select installed Chromium
        run: >-
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV,
          'CHROMIUM_PATH=' + require('playwright').chromium.executablePath() + '\n')"
      - name: Run unit and integration regressions
        run: |
          mkdir -p work
          node --test tests/*.test.cjs | tee work/node-tests.log
      - name: Verify complete runtime packaging
        run: >-
          python3 scripts/build-runtime-release.py
          --output "$RUNNER_TEMP/phigros-runtime"
          --report work/runtime-package.json
      - name: Verify measured remote-resource evidence without downloads
        run: >-
          python3 scripts/audit-remote-resources.py
          --plan docs/evidence/2026-11-10-remote-resources/plan.json.gz
          --verify-journal docs/evidence/2026-11-10-remote-resources/results.jsonl.gz
      - name: Verify vision measurements including recorded source limits
        run: >-
          python3 scripts/audit-remote-resources.py
          --plan docs/evidence/2026-11-10-vision-resources/plan.json
          --verify-journal docs/evidence/2026-11-10-vision-resources/content-results.jsonl
          --allow-blocked
      - name: Run actual app and persistent storage browser checks
        env:
          PHI_FLOW_VIDEO: '1'
        run: |
          python3 -m http.server 4180 --bind 127.0.0.1 > work/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/full-flow-browser.cjs http://127.0.0.1:4180 work/browser-flow
          node tests/audio-transport-browser.cjs http://127.0.0.1:4180 work/audio-transport
          node tests/stream-recovery-browser.cjs http://127.0.0.1:4180 work/stream-recovery
          node tests/audio-gesture-prime-browser.cjs http://127.0.0.1:4180 work/audio-gesture-prime
          node tests/audio-session-ownership-browser.cjs http://127.0.0.1:4180 work/audio-session-ownership
          node tests/loading-cancel-browser.cjs http://127.0.0.1:4180 work/loading-cancel
          node tests/service-worker-browser.cjs work/service-worker
          node tests/folder-import-browser.cjs http://127.0.0.1:4180 work/folder-import
          node tests/library-migration-browser.cjs | tee work/library-migration.log
          node tests/interactive-replay-media-browser.cjs | tee work/replay-media.log
      - name: Audit vision networking independently
        if: ${{ always() && !cancelled() }}
        run: |
          mkdir -p work
          python3 -m http.server 4180 --bind 127.0.0.1 > work/vision-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          audit_status=0
          main_cors_action=$(python3 scripts/main-cors-checkpoint.py) || { audit_status=$?; main_cors_action=checkpoint-failed; }
          if [[ "$main_cors_action" == "run" ]]; then
            node scripts/audit-remote-cors-batch.cjs http://127.0.0.1:4180 work/remote-cors docs/evidence/2026-11-10-remote-resources/plan.json.gz || audit_status=$?
          elif [[ "$main_cors_action" == "reuse" ]]; then
            echo "Reusing dated CI #8 main CORS evidence: exact tested sources unchanged; no 1091-URL re-audit."
          else
            echo "Main CORS checkpoint failed; preserving its failure and continuing independent vision checks."
          fi
          node scripts/audit-vision-cors.cjs http://127.0.0.1:4180 work/vision-cors || audit_status=$?
          exit "$audit_status"
      - name: Keep engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-regression-${{ github.sha }}
          path: work/
          retention-days: 14
