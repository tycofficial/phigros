name: Verify published runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-published-runtime
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages and verify published bytes
        run: >-
          python3 scripts/verify-published-runtime.py
          --base-url https://tycofficial.github.io/phigros/
          --timeout 540
          --interval 10
          --output work/deployment/live-check.json
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-runtime-verification
          path: work/deployment/live-check.json
          retention-days: 7
